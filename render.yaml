databases:
  - name: ewaste-db
    plan: starter
    postgresMajorVersion: "16"

services:
  # ---------- Backend (ASP.NET Core API) ----------
  - type: web
    name: ewaste-backend
    runtime: docker
    plan: starter
    rootDir: backend/EWasteManagement.API
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase: { name: ewaste-db, property: connectionString }
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: EWasteApi
      - key: Jwt__Audience
        value: EWasteClients
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: Agent__ApiKey
        generateValue: true
      - key: Agent__BaseUrl
        fromService: { name: ewaste-sales-agent, type: pserv, property: hostport }
      - key: Agent__PlannerBaseUrl
        fromService: { name: ewaste-planner-agent, type: pserv, property: hostport }
      - key: Agent__AnalyzerBaseUrl
        fromService: { name: ewaste-submission-agent, type: pserv, property: hostport }
      - key: Agent__ValidatorBaseUrl
        fromService: { name: ewaste-processing-agent, type: pserv, property: hostport }
      - key: Agent__MatcherBaseUrl
        fromService: { name: ewaste-collection-agent, type: pserv, property: hostport }

  # ---------- The 5 Python agents (private — no public URL) ----------
  - type: pserv
    name: ewaste-sales-agent
    runtime: docker
    plan: starter
    rootDir: agentic-ai/Sales
    dockerfilePath: ../Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService: { name: ewaste-backend, type: web, property: hostport }
      - key: AGENT_API_KEY
        fromService: { name: ewaste-backend, type: web, envVarKey: Agent__ApiKey }

  - type: pserv
    name: ewaste-planner-agent
    runtime: docker
    plan: starter
    rootDir: agentic-ai/Planner
    dockerfilePath: ../Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService: { name: ewaste-backend, type: web, property: hostport }
      - key: AGENT_API_KEY
        fromService: { name: ewaste-backend, type: web, envVarKey: Agent__ApiKey }
      - key: GOOGLE_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.5-flash

  - type: pserv
    name: ewaste-submission-agent
    runtime: docker
    plan: starter
    rootDir: agentic-ai/Submission
    dockerfilePath: ../Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService: { name: ewaste-backend, type: web, property: hostport }
      - key: AGENT_API_KEY
        fromService: { name: ewaste-backend, type: web, envVarKey: Agent__ApiKey }
      - key: GOOGLE_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.5-flash

  - type: pserv
    name: ewaste-processing-agent
    runtime: docker
    plan: starter
    rootDir: agentic-ai/Processing
    dockerfilePath: ../Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService: { name: ewaste-backend, type: web, property: hostport }
      - key: AGENT_API_KEY
        fromService: { name: ewaste-backend, type: web, envVarKey: Agent__ApiKey }

  - type: pserv
    name: ewaste-collection-agent
    runtime: docker
    plan: starter
    rootDir: agentic-ai/Collection
    dockerfilePath: ../Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService: { name: ewaste-backend, type: web, property: hostport }
      - key: AGENT_API_KEY
        fromService: { name: ewaste-backend, type: web, envVarKey: Agent__ApiKey }

  # ---------- Frontend (static React build — no Docker needed) ----------
  - type: web
    name: ewaste-frontend
    runtime: static
    rootDir: frontend-react/project
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ewaste-backend.onrender.com