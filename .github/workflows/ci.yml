name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore EWasteManagement.sln

      - name: Build
        run: dotnet build EWasteManagement.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test EWasteManagement.sln --no-build --configuration Release --verbosity normal