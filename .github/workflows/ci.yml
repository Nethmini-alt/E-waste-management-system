name: CI

# G5 — runs every automated test in the project on each push / PR to main and develop,
# and keeps every report as a downloadable artifact (Actions → run → Artifacts).
#
#   backend   xUnit tests + code coverage (ReportGenerator)
#   frontend  React install + production build
#   flutter   Flutter tests + coverage
#   agents    pytest for each AI agent (+ the Sales agent's manual component test)
#   e2e       Playwright integrated E2E (+ security tests) against a real PostgreSQL,
#             then a k6 smoke performance test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:        # "Run workflow" button, for re-running on demand (e.g. in the viva)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — xUnit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EWasteManagement.sln

      - name: Build
        run: dotnet build EWasteManagement.sln --no-restore --configuration Release

      - name: Test (with TRX results and coverage)
        run: >
          dotnet test EWasteManagement.sln --no-build --configuration Release
          --logger "trx;LogFileName=backend-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: backend/TestResults/**/coverage.cobertura.xml
          targetdir: backend/coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub

      - name: Coverage summary on the run page
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/TestResults/**/*.trx
            backend/coverage-report

  frontend:
    name: Web app — install + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react/project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/project/package-lock.json

      - run: npm ci
      - run: npm run build
      # When the React component tests (Vitest) are added, run them here:
      # - run: npx vitest run --coverage

  flutter:
    name: Mobile app — Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: mobile_flutter/coverage/lcov.info
          if-no-files-found: ignore

  agents:
    name: AI agent — ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [ Submission, Collection, Processing, Planner, Sales ]
    defaults:
      run:
        working-directory: agentic-ai/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agentic-ai/${{ matrix.agent }}/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt pytest
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi


      - name: pytest
        run: |
          set +e
          python -m pytest -q --junitxml=pytest-results.xml
          code=$?
          # Exit code 5 = no tests collected yet: not a failure while members are still adding tests.
          if [ "$code" -eq 5 ]; then echo "No pytest tests yet for ${{ matrix.agent }}"; exit 0; fi
          exit $code

      - name: Manual component test (Sales agent)
        if: hashFiles(format('agentic-ai/{0}/manual_test.py', matrix.agent)) != ''
        run: python manual_test.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.agent }}
          path: agentic-ai/${{ matrix.agent }}/pytest-results.xml
          if-no-files-found: ignore

  e2e:
    name: Integrated E2E + security (Playwright) + performance smoke (k6)
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      E2E_DB_PASSWORD: postgres

    defaults:
      run:
        working-directory: frontend-react/project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/project/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Starts the stub agents, an isolated API (port 5180) on the Postgres service, and the
      # web app, then runs every Playwright project (setup, api-e2e, ui-e2e, security if present).
      - name: Playwright tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            frontend-react/project/e2e-report
            frontend-react/project/e2e-results

      # ---- k6 smoke test (runs once the G2 scripts are in the repo) ----
      - uses: grafana/setup-k6-action@v1
        if: hashFiles('tests/performance/k6/smoke.js') != ''

      - name: k6 smoke test
        if: hashFiles('tests/performance/k6/smoke.js') != ''
        run: |
          E2E_KEEP_DB=1 nohup node e2e/scripts/start-api.mjs > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5180/healthz && break; sleep 2; done
          cd ../../tests/performance/k6
          mkdir -p results
          K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_EXPORT=results/smoke-report.html \
            k6 run --summary-export results/smoke-summary.json smoke.js

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tests/performance/k6/smoke.js') != ''
        with:
          name: k6-smoke
          path: tests/performance/k6/results
